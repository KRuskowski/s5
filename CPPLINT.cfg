# Mirrors cli/CPPLINT.cfg so the two repos, which share a code style,
# are linted the same way. Without this, cpplint on s5 buries real
# findings under 28 style-policy disagreements and nobody runs it.
set noparent
filter=-build/include_order
filter=-build/include_subdir
filter=-runtime/references
filter=-build/c++11
filter=-readability/casting
filter=-runtime/int
filter=-readability/todo
# The house style puts the /// @file doc block above the copyright line,
# which is outside the window cpplint scans for it.
filter=-legal/copyright
# Every header here guards on EINHEIT_S5_<FILE>_H_, not cpplint's
# path-derived INCLUDE_EINHEIT_S5_<FILE>_H_. The convention is uniform
# across the repo, so the linter is wrong about this codebase.
filter=-build/header_guard
linelength=79
exclude_files=build
exclude_files=build-debug
exclude_files=build-arm
exclude_files=build-aarch64
exclude_files=cmake
exclude_files=third_party
exclude_files=.git
